name: Update calendar feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh events and ICS
        run: node scripts/update-calendar.js

      - name: Commit changes
        run: |
          if git diff --quiet -- events.json calendar.ics; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json calendar.ics
          git commit -m "chore: update calendar feed"
          git push origin HEAD:${GITHUB_REF_NAME}
