<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>EnMed Calendar</title>
    <meta
      name="description"
      content="View the EnMed PCT Calendar – embedded directly from the official TAMU source."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* ── Embedded calendar page layout ─────────────────── */
      .cal-embed-page {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        background: var(--bg, #f5f5f7);
      }

      .cal-embed-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.5rem;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .cal-embed-toolbar .dash-logo {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        color: #1d1d1f;
        letter-spacing: -0.02em;
      }

      .cal-embed-nav {
        display: flex;
        gap: 0.25rem;
      }

      .cal-embed-nav a {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.85rem;
        font-weight: 500;
        color: #6e6e73;
        text-decoration: none;
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        transition: color 0.2s, background 0.2s;
      }

      .cal-embed-nav a:hover {
        color: #1d1d1f;
        background: rgba(0, 0, 0, 0.04);
      }

      .cal-embed-nav a.is-active {
        color: #1d1d1f;
        background: rgba(0, 0, 0, 0.06);
      }

      .cal-embed-frame-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .cal-embed-frame-wrap iframe {
        flex: 1;
        width: 100%;
        border: none;
        min-height: calc(100dvh - 52px);
      }

      /* Open in new tab link */
      .cal-embed-external-link {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.78rem;
        font-weight: 500;
        color: #6e6e73;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.35rem 0.7rem;
        border-radius: 6px;
        transition: color 0.2s, background 0.2s;
      }

      .cal-embed-external-link:hover {
        color: #1d1d1f;
        background: rgba(0, 0, 0, 0.04);
      }

      .cal-embed-external-link svg {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="cal-embed-page">
      <!-- ── Compact toolbar ──────────────────────────────── -->
      <header class="cal-embed-toolbar">
        <span class="dash-logo">EnMed Calendar</span>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <nav class="cal-embed-nav">
            <a href="index.html">Home</a>
            <a href="calendar.html" class="is-active">Calendar</a>
          </nav>
          <a
            href="https://tamu-edu.github.io/enmed-pct-calendar/"
            target="_blank"
            rel="noopener noreferrer"
            class="cal-embed-external-link"
            title="Open calendar in new tab"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M5.5 2H3a1 1 0 00-1 1v8a1 1 0 001 1h8a1 1 0 001-1V8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 2h4v4M7 7l5-5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Open in new tab
          </a>
        </div>
      </header>

      <!-- ── Embedded calendar iframe ─────────────────────── -->
      <div class="cal-embed-frame-wrap">
        <iframe
          id="calendarFrame"
          src="https://tamu-edu.github.io/enmed-pct-calendar/"
          title="EnMed PCT Calendar"
          loading="eager"
          allow="fullscreen"
          sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        ></iframe>
      </div>
    </div>
  </body>
</html>
