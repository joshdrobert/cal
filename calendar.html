<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>EnMed Calendar</title>
    <meta
      name="description"
      content="Filterable calendar-style view for the mirrored EnMed PCT events feed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="calendar-page">
    <div class="cal-app">
      <!-- ── STICKY TOOLBAR ─────────────────────────────── -->
      <header class="cal-toolbar" id="calToolbar">
        <div class="cal-toolbar-top">
          <div class="cal-nav-group">
            <button id="prevPeriod" type="button" class="cal-nav-btn" aria-label="Previous period">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1 id="calendarTitle" class="cal-title">July 2026</h1>
            <button id="nextPeriod" type="button" class="cal-nav-btn" aria-label="Next period">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="cal-toolbar-actions">
            <button id="todayPeriod" type="button" class="cal-today-btn">Today</button>
            <div class="cal-view-switcher" role="tablist" aria-label="View mode">
              <button id="viewMonth" type="button" class="cal-view-btn is-active" aria-pressed="true">Month</button>
              <button id="viewWeek" type="button" class="cal-view-btn" aria-pressed="false">Week</button>
              <button id="viewDay" type="button" class="cal-view-btn" aria-pressed="false">Day</button>
            </div>
          </div>
        </div>

        <!-- mCal chip row -->
        <div class="cal-chip-row" id="mCalChips" role="tablist" aria-label="Calendar filter"></div>
      </header>

      <!-- ── FILTER DRAWER (toggled) ────────────────────── -->
      <div class="cal-filter-drawer" id="filterDrawer">
        <div class="cal-filter-bar">
          <div class="cal-search-wrap">
            <svg class="cal-search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="searchInput" type="search" placeholder="Search events…" />
          </div>
          <select id="categoryFilter" class="cal-select" aria-label="Category filter"></select>
          <select id="blockFilter" class="cal-select" aria-label="Block filter"></select>
          <select id="mandFilter" class="cal-select" aria-label="Mandatory filter"></select>
          <select id="groupFilter" class="cal-select" aria-label="Group filter"></select>
          <button id="resetFilters" type="button" class="cal-reset-btn" aria-label="Reset filters">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Reset
          </button>
        </div>
      </div>

      <!-- ── STATS STRIP ────────────────────────────────── -->
      <div class="cal-stats-strip">
        <div class="cal-stat"><strong id="eventCount">0</strong><span>Events</span></div>
        <div class="cal-stat"><strong id="upcomingCount">0</strong><span>Upcoming</span></div>
        <div class="cal-stat"><strong id="activeMCal">All</strong><span>Calendar</span></div>
        <div class="cal-stat"><strong id="lastUpdated">--</strong><span>Updated</span></div>
        <p id="resultSummary" class="cal-stat-summary"></p>
      </div>
      <!-- ── CALENDAR BOARD ─────────────────────────────── -->
      <main class="cal-board">
        <div id="calendarView" class="cal-view" aria-live="polite"></div>
      </main>

      <!-- ── SUBSCRIBE / DOWNLOAD BAR ───────────────────── -->
      <footer class="cal-footer">
        <div class="cal-footer-inner">
          <div class="cal-footer-ics">
            <label for="icsUrl" class="cal-footer-label">ICS Feed</label>
            <div class="cal-footer-url-row">
              <input id="icsUrl" type="text" readonly aria-label="ICS subscription URL" />
              <button id="copyIcsUrl" type="button" class="cal-copy-btn">Copy</button>
            </div>
          </div>
          <button id="downloadFilteredIcs" type="button" class="cal-download-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0l-3-3m3 3l3-3M3 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download ICS
          </button>
        </div>
      </footer>

      <!-- ── EVENT DETAIL MODAL ─────────────────────────── -->
      <div class="cal-modal-overlay" id="eventModal">
        <div class="cal-modal">
          <button class="cal-modal-close" id="closeModal" type="button" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div id="modalBody"></div>
        </div>
      </div>
    </div>

    <template id="eventTemplate">
      <article class="agenda-card agenda-card--full">
        <div class="agenda-card-topline">
          <div>
            <p class="agenda-card-time"></p>
            <h4 class="agenda-card-title"></h4>
          </div>
          <span class="agenda-card-badge"></span>
        </div>
        <p class="agenda-card-meta"></p>
        <p class="agenda-card-desc"></p>
        <dl class="agenda-card-fields"></dl>
      </article>
    </template>

    <script src="calendar.js"></script>
  </body>
</html>
